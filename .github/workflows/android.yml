name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform folder only
        run: flutter create --platforms=android --org com.gazinizx.berberim .
      - name: Ensure internet permission in release manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in text:
              marker = '<application'
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml içinde <application> bulunamadı")
              text = text.replace(marker, permission + "\n    " + marker, 1)
              path.write_text(text)
          print("INTERNET permission present in main manifest")
          PY
      - name: Restore tracked test after Flutter scaffolding
        run: git checkout -- test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Berberim-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
