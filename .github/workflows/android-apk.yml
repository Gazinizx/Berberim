name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [supabase-migration]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.gazinizx --project-name berberim .; fi
      - name: Ensure release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest missing: {manifest}")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in text:
              text = re.sub(r'(<application\b)', permission + '\n    \1', text, count=1)
              manifest.write_text(text)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("INTERNET permission was not added to the main manifest")
          print("Verified INTERNET permission in main Android manifest.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://tzwlbwhokvnjekwwpnsr.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_dkvrMB41cXEeH2dBdKAwxA_MFWTZyW0
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-supabase-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
