name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.gazinizx --project-name berberim .; fi
      - name: Configure Firebase and Android notifications
        run: |
          set -euo pipefail
          test -f firebase/google-services.json
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")
          app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle")
          if not settings.exists() or not app_gradle.exists():
              raise SystemExit("Generated Android Gradle files were not found")

          text = settings.read_text()
          if "com.google.gms.google-services" not in text:
              if settings.suffix == ".kts":
                  declaration = '    id("com.google.gms.google-services") version "4.6.0" apply false\n'
              else:
                  declaration = "    id 'com.google.gms.google-services' version '4.6.0' apply false\n"
              text = text.replace("plugins {", "plugins {\n" + declaration, 1)
              settings.write_text(text)

          text = app_gradle.read_text()
          if "com.google.gms.google-services" not in text:
              if app_gradle.suffix == ".kts":
                  declaration = '    id("com.google.gms.google-services")\n'
              else:
                  declaration = "    id 'com.google.gms.google-services'\n"
              text = text.replace("plugins {", "plugins {\n" + declaration, 1)

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit("Android compileOptions block was not found")
              text = text.replace(marker, marker + "\n        isCoreLibraryDesugaringEnabled = true", 1) if app_gradle.suffix == ".kts" else text.replace(marker, marker + "\n        coreLibraryDesugaringEnabled true", 1)

          if "multiDexEnabled" not in text:
              if app_gradle.suffix == ".kts":
                  text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
              else:
                  text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
          if app_gradle.suffix == ".kts":
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = maxOf(flutter.minSdkVersion, 24)")
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = maxOf(flutter.compileSdkVersion, 35)")
          else:
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion Math.max(flutter.minSdkVersion, 24)")
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion Math.max(flutter.compileSdkVersion, 35)")

          if "desugar_jdk_libs" not in text:
              if app_gradle.suffix == ".kts":
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
              else:
                  text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n"
          app_gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if "android.permission.POST_NOTIFICATIONS" not in text:
              point = text.find("<application")
              if point < 0:
                  raise SystemExit("Android application tag was not found")
              text = text[:point] + permission + "\n    " + text[point:]

          metadata = [
              '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="berberim_notifications" />',
              '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />',
          ]
          point = text.find("<application")
          close = text.find(">", point)
          for item in metadata:
              marker = item.split('"')[1]
              if marker not in text:
                  text = text[:close + 1] + "\n            " + item + text[close + 1:]
                  close = text.find(">", point)
          manifest.write_text(text)
          print("Firebase Android configuration and notification channel verified.")
          PY
      - name: Set Android app display name
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(r'android:label="[^"]+"', 'android:label="Berberim"', s, count=1)
          if count != 1:
              raise SystemExit("Android app label was not found")
          p.write_text(s)
          print("Android app display name set to Berberim.")
          PY
      - name: Configure email confirmation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<!-- BERBERIM_AUTH_DEEP_LINK -->'
          if marker not in s:
              activity = s.find('<activity')
              if activity < 0:
                  raise SystemExit("Main activity not found in AndroidManifest.xml")
              close = s.find('>', activity) + 1
              block = '''
                  <!-- BERBERIM_AUTH_DEEP_LINK -->
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="berberim" android:host="login-callback" />
                  </intent-filter>
              '''
              s = s[:close] + block + s[close:]
              p.write_text(s)
          if 'android:scheme="berberim"' not in p.read_text():
              raise SystemExit("Berberim auth deep link not configured")
          print("Android email confirmation deep link configured.")
          PY
      - name: Ensure release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest missing: {manifest}")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in text:
              insertion_point = text.find("<application")
              if insertion_point < 0:
                  raise SystemExit("AndroidManifest.xml has no <application> element")
              text = text[:insertion_point] + permission + "\n    " + text[insertion_point:]
              manifest.write_text(text)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("INTERNET permission was not added to the main manifest")
          print("Verified INTERNET permission in main Android manifest.")
          PY
      - name: Ensure camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA"/>'
          if "android.permission.CAMERA" not in s:
              i = s.find('<application')
              if i < 0: raise SystemExit("Android application tag not found")
              s = s[:i] + permission + "\n    " + s[i:]
              p.write_text(s)
          if "android.permission.CAMERA" not in p.read_text(): raise SystemExit("Camera permission missing")
          print("Camera permission configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://esnrbyegnxykvsghsjjq.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cxdhKUO8dybl-RrK-WqK6w_f6nVDz_v
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-supabase-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
