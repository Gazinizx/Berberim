name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.gazinizx --project-name berberim .; fi
      - name: Set Android app display name
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(r'android:label="[^"]+"', 'android:label="Berberim"', s, count=1)
          if count != 1:
              raise SystemExit("Android app label was not found")
          p.write_text(s)
          print("Android app display name set to Berberim.")
          PY
      - name: Configure email confirmation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<!-- BERBERIM_AUTH_DEEP_LINK -->'
          if marker not in s:
              activity = s.find('<activity')
              if activity < 0:
                  raise SystemExit("Main activity not found in AndroidManifest.xml")
              close = s.find('>', activity) + 1
              block = '''
                  <!-- BERBERIM_AUTH_DEEP_LINK -->
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="berberim" android:host="login-callback" />
                  </intent-filter>
              '''
              s = s[:close] + block + s[close:]
              p.write_text(s)
          if 'android:scheme="berberim"' not in p.read_text():
              raise SystemExit("Berberim auth deep link not configured")
          print("Android email confirmation deep link configured.")
          PY
      - name: Ensure release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest missing: {manifest}")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in text:
              insertion_point = text.find("<application")
              if insertion_point < 0:
                  raise SystemExit("AndroidManifest.xml has no <application> element")
              text = text[:insertion_point] + permission + "\n    " + text[insertion_point:]
              manifest.write_text(text)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("INTERNET permission was not added to the main manifest")
          print("Verified INTERNET permission in main Android manifest.")
          PY
      - name: Ensure camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA"/>'
          if "android.permission.CAMERA" not in s:
              i = s.find('<application')
              if i < 0: raise SystemExit("Android application tag not found")
              s = s[:i] + permission + "\\n    " + s[i:]
              p.write_text(s)
          if "android.permission.CAMERA" not in p.read_text(): raise SystemExit("Camera permission missing")
          print("Camera permission configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://esnrbyegnxykvsghsjjq.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cxdhKUO8dybl-RrK-WqK6w_f6nVDz_v
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-supabase-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
