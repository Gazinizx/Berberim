name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [supabase-migration]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.gazinizx --project-name berberim .; fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://tzwlbwhokvnjekwwpnsr.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_dkvrMB41cXEeH2dBdKAwxA_MFWTZyW0
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-supabase-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
