name: iOS preparation (manual only)
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.gazinizx.berberim .
      - name: Install dependencies
        run: flutter pub get
      - name: Verify iOS project (no archive or upload)
        run: flutter analyze
