name: Build iOS App (unsigned)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 for Firebase iOS SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare iOS platform
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.gazinizx --project-name=berberim .; fi
      - name: Set iOS deployment target
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          podfile = Path("ios/Podfile")
          pod_text = podfile.read_text()
          pod_text, count = re.subn(
              r"^\s*#?\s*platform :ios,.*$",
              "platform :ios, '15.5'",
              pod_text,
              count=1,
              flags=re.MULTILINE,
          )
          if count == 0:
              pod_text = "platform :ios, '15.5'\n" + pod_text
          podfile.write_text(pod_text)

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          project_text = project.read_text()
          project_text, count = re.subn(
              r"IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.5;",
              project_text,
          )
          if count == 0:
              raise SystemExit("No iOS deployment target found in Xcode project")
          project.write_text(project_text)

          if "platform :ios, '15.5'" not in podfile.read_text():
              raise SystemExit("Podfile iOS platform was not raised to 15.5")
          if "IPHONEOS_DEPLOYMENT_TARGET = 15.5;" not in project.read_text():
              raise SystemExit("Xcode iOS deployment target was not raised to 15.5")
          print(f"iOS deployment target set to 15.5 in Podfile and {count} Xcode build settings.")
          PY
      - name: Configure Berberim auth callback
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          data = plistlib.loads(p.read_bytes())
          data["CFBundleDisplayName"] = "Berberim"
          url_types = data.get("CFBundleURLTypes", [])
          if not any("berberim" in item.get("CFBundleURLSchemes", []) for item in url_types):
              url_types.append({"CFBundleURLSchemes": ["berberim"]})
          data["CFBundleURLTypes"] = url_types
          p.write_bytes(plistlib.dumps(data))
          check = plistlib.loads(p.read_bytes())
          if not any("berberim" in item.get("CFBundleURLSchemes", []) for item in check.get("CFBundleURLTypes", [])):
              raise SystemExit("Berberim auth callback URL scheme missing")
          print("iOS auth callback configured.")
          PY
      - name: Configure QR scanner camera permission
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          data = plistlib.loads(p.read_bytes())
          data["NSCameraUsageDescription"] = "İşletme QR kodunu tarayarak Berberim'e katılmak için kamera erişimi gerekir."
          p.write_bytes(plistlib.dumps(data))
          if not plistlib.loads(p.read_bytes()).get("NSCameraUsageDescription"): raise SystemExit("Camera usage description missing")
          print("iOS camera usage description configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://esnrbyegnxykvsghsjjq.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cxdhKUO8dybl-RrK-WqK6w_f6nVDz_v
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
