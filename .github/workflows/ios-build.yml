name: Build iOS App (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, clean-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare iOS platform
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --project-name=berberim .; fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Build unsigned iOS app (Supabase)
        run: |
          flutter build ios --release --no-codesign -t lib/professional_main.dart \
            --dart-define=SUPABASE_URL=https://tzwlbwhokvnjekwwpnsr.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_dkvrMB41cXEeH2dBdKAwxA_MFWTZyW0
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
