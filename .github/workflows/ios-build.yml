name: Build iOS App (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main, clean-rebuild, supabase-migration]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare iOS platform
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.gazinizx --project-name=berberim .; fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
