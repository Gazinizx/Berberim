name: Build iOS App (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare iOS platform
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.gazinizx --project-name=berberim .; fi
      - name: Configure Berberim auth callback
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          data = plistlib.loads(p.read_bytes())
          data["CFBundleDisplayName"] = "Berberim"
          url_types = data.get("CFBundleURLTypes", [])
          if not any("berberim" in item.get("CFBundleURLSchemes", []) for item in url_types):
              url_types.append({"CFBundleURLSchemes": ["berberim"]})
          data["CFBundleURLTypes"] = url_types
          p.write_bytes(plistlib.dumps(data))
          check = plistlib.loads(p.read_bytes())
          if not any("berberim" in item.get("CFBundleURLSchemes", []) for item in check.get("CFBundleURLTypes", [])):
              raise SystemExit("Berberim auth callback URL scheme missing")
          print("iOS auth callback configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://esnrbyegnxykvsghsjjq.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cxdhKUO8dybl-RrK-WqK6w_f6nVDz_v
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
