name: Build iOS App (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare iOS platform
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --project-name=berberim .; fi
      - name: Configure Berberim auth callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          s = p.read_text()
          if "berberim" not in s:
              block = """\n<key>CFBundleURLTypes</key>
          <array>
            <dict>
              <key>CFBundleURLSchemes</key>
              <array><string>berberim</string></array>
            </dict>
          </array>\n"""
              s = s.replace("</dict>", block + "</dict>", 1)
              p.write_text(s)
          if "berberim" not in p.read_text():
              raise SystemExit("Berberim auth callback URL scheme missing")
          print("iOS auth callback configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://esnrbyegnxykvsghsjjq.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cxdhKUO8dybl-RrK-WqK6w_f6nVDz_v
      - uses: actions/upload-artifact@v4
        with:
          name: berberim-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
